name: Build and Release
permissions:
  contents: write
on:
  push:
    branches:
      - freespawn-forge
  workflow_dispatch:

jobs:
  build:
    name: Compile Mod
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      # 1) actually pull down the JAR that your build job uploaded
      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: mod-jar
          # you can omit `path:` and it will extract to `./mod-jar/`, or
          # point it somewhere else if you like:
          # path: .

      # 2) figure out the real filename (wildcards don’t work in `with:`)
      - name: Get JAR file path
        id: find_jar
        run: |
          # assumes your artifact contained build/libs/*.jar
          JAR=$(find . -type f -name '*.jar' | head -n1)
          echo "JAR_PATH=$JAR" >> $GITHUB_ENV

      # 3) create the GitHub Release named after the commit SHA
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name:        beta-${{ github.sha }}
          release_name:    Prerelease beta ${{ github.sha }}
          draft:           false
          prerelease:      true

      # 4) upload that exact JAR file
      - name: Upload Mod JAR to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url:        ${{ steps.create_release.outputs.upload_url }}
          asset_path:        ${{ env.JAR_PATH }}
          # if you want to rename it in the UI, you can do so here:
          asset_name:        freespawn-${{ github.sha }}.jar
          asset_content_type: application/java-archive

